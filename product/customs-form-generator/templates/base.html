<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>{% block title %}Customs Form Generator{% endblock %} - Cheshire Horse</title>
<style>
  :root {
    --ink: #1f2a24;
    --muted: #6b7a70;
    --border: #d9e0da;
    --accent: #2f6b4f;
    --accent-bg: #eaf3ee;
    --warn: #a15c00;
    --warn-bg: #fdf1de;
    --bg: #f7f8f6;
  }
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
    color: var(--ink);
    background: var(--bg);
    margin: 0;
    padding: 24px;
  }
  h1 { font-size: 1.4rem; margin: 0 0 4px; }
  h2 { font-size: 1.1rem; margin: 24px 0 8px; }
  .sub { color: var(--muted); margin: 0 0 20px; font-size: 0.92rem; }
  .card {
    background: #fff;
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 20px 24px;
    margin-bottom: 20px;
    max-width: 1180px;
  }
  table { border-collapse: collapse; width: 100%; font-size: 0.86rem; }
  th, td { padding: 6px 8px; border-bottom: 1px solid var(--border); text-align: left; vertical-align: top; }
  th { background: #f0f2ef; position: sticky; top: 0; font-weight: 600; }
  tr.needs-review { background: var(--warn-bg); }
  tr.matched { background: var(--accent-bg); }
  input[type=text], select {
    width: 100%;
    padding: 4px 6px;
    border: 1px solid var(--border);
    border-radius: 5px;
    font-size: 0.85rem;
    font-family: inherit;
  }
  .badge {
    display: inline-block;
    padding: 2px 8px;
    border-radius: 999px;
    font-size: 0.72rem;
    font-weight: 600;
  }
  .badge.ok { background: var(--accent-bg); color: var(--accent); }
  .badge.warn { background: var(--warn-bg); color: var(--warn); }
  button, .btn {
    background: var(--accent);
    color: #fff;
    border: none;
    padding: 10px 20px;
    border-radius: 8px;
    font-size: 0.95rem;
    cursor: pointer;
    text-decoration: none;
    display: inline-block;
  }
  button.secondary, .btn.secondary { background: #fff; color: var(--accent); border: 1px solid var(--accent); }
  .row { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
  .hint { font-size: 0.78rem; color: var(--muted); margin-top: 2px; }
  label { font-weight: 600; font-size: 0.9rem; }
  @media print {
    body { background: #fff; padding: 0; }
    .no-print { display: none !important; }
    .card { border: none; box-shadow: none; max-width: none; }
  }
</style>
</head>
<body>
{% block body %}{% endblock %}
</body>
</html>
